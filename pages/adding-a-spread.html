<html lang="en">
<head>

<body>
  <div class="app-shell">
    <aside class="exercise-index" id="exercise-index-root"></aside>

    <main class="exercise-content">
  <h1>4.2 Adding a Spread</h1>

  <div class="stack">
    <div class="panel">
      <h2>Main Market (Point 2.75) &#92; Spread 0.10</h2>
      <div class="table-scroll">
      <table id="spread-table">
        <thead>
          <tr>
            <th rowspan="2"></th>
            <th colspan="2">Probability</th>
            <th colspan="2">Euro Odds</th>
            <th colspan="2">HK Odds</th>
            <th colspan="2">Malay Odds</th>
          </tr>
          <tr>
            <th>Over</th>
            <th>Under</th>
            <th>Over</th>
            <th>Under</th>
            <th>Over</th>
            <th>Under</th>
            <th>Over</th>
            <th>Under</th>
          </tr>
        </thead>
        <tbody>
          <tr id="fair-row"></tr>
          <tr id="spread-row"></tr>
        </tbody>
      </table>
      </div>

      <p class="step-note active">Fill in the second row: split the 0.10 spread evenly (0.05 each side) off the fair Malay odds, then work out HK, Euro and Probability from there.</p>

      <div class="controls">
        <button id="check-spread">Check</button>
        <button id="fill-spread">Show Answers</button>
      </div>
    </div>
  </div>

  <div class="controls" id="page-footer-root"></div>
    </main>
