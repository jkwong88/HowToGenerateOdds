<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 2 - Final Score Probability Matrix</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="exercise-index" id="exercise-index-root"></aside>

    <main class="exercise-content">
  <h1>Exercise 2: Final Score Probability Matrix</h1>

  <div class="stack">
    <div class="panel">
      <h2>Given: Probability Table (from Part 3)</h2>
      <table id="given-table">
        <thead>
          <tr id="given-header"><th>Goals</th></tr>
        </thead>
        <tbody>
          <tr id="given-home-row"><td class="row-label">Home</td></tr>
          <tr id="given-away-row"><td class="row-label">Away</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel" id="matrix-section">
      <h2>Final Score Probability Table</h2>
      <table id="matrix-table">
        <thead>
          <tr id="matrix-header"><th>Home &#92; Away</th></tr>
        </thead>
        <tbody id="matrix-body"></tbody>
      </table>
      <div class="controls">
        <button id="check-matrix">Check</button>
        <button id="fill-matrix">Show Answers</button>
      </div>
    </div>
  </div>

  <div class="controls" id="page-footer-root"></div>
    </main>

    <aside class="formula-card" id="formula-card-root"></aside>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/formula-cards.js"></script>
  <script src="../js/exercise-common.js"></script>
  <script src="../js/final-score-probability-matrix.js"></script>
</body>
</html>
