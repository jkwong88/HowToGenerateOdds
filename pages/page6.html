<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Exercise 6 - Opening the Over / Under Market</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="page">
  <h1>
    Exercise 6: Opening the Over / Under Market
    <label for="market-count-select" class="point-label">Markets:</label>
    <select id="market-count-select" class="point-select">
      <option value="1" selected>1 market</option>
      <option value="2">2 markets</option>
      <option value="3">3 markets</option>
    </select>
  </h1>

  <div class="stack">
    <div class="panel">
      <h2>Over / Under Table (Point 0.25 - 4)</h2>
      <div class="table-scroll">
        <table id="ou-sweep-table">
          <thead>
            <tr>
              <th rowspan="2">Select</th>
              <th rowspan="2">Point</th>
              <th colspan="2">True Probability</th>
              <th colspan="2">Euro Odds</th>
              <th colspan="2">HK Odds</th>
              <th colspan="2">Malay Odds</th>
            </tr>
            <tr>
              <th>Over</th>
              <th>Under</th>
              <th>Over</th>
              <th>Under</th>
              <th>Over</th>
              <th>Under</th>
              <th>Over</th>
              <th>Under</th>
            </tr>
          </thead>
          <tbody id="ou-sweep-body"></tbody>
        </table>
      </div>

      <p class="step-note active" id="market-step-note"></p>

      <div class="controls">
        <button id="check-market">Check</button>
        <button id="fill-market">Show Answers</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button id="reset-btn">Reset All</button>
    <button id="toggle-formula-btn">Formula Hover: On</button>
    <div class="page-nav" id="page-nav"></div>
  </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/exercise-common.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/page6.js"></script>
</body>
</html>
