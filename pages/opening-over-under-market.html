<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4.1 Opening the Market</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="exercise-index" id="exercise-index-root"></aside>

    <main class="exercise-content">
  <h1>
    4.1 Opening the Market
    <label for="market-type-select" class="point-label">Market Type:</label>
    <select id="market-type-select" class="point-select">
      <option value="ou" selected>Over / Under</option>
      <option value="hdp">Handicap</option>
    </select>
    <label for="market-count-select" class="point-label">Number of Main Lines:</label>
    <select id="market-count-select" class="point-select">
      <option value="1" selected>1 line</option>
      <option value="2">2 lines</option>
      <option value="3">3 lines</option>
    </select>
  </h1>

  <div class="stack">
    <div class="panel">
      <h2 id="sweep-title">Over / Under Lines (0.50&ndash;4.00)</h2>
      <div class="table-scroll">
        <table id="ou-sweep-table">
          <thead>
            <tr>
              <th rowspan="2">Select</th>
              <th rowspan="2" id="sweep-point-header">Line</th>
              <th colspan="2">Fair Probability</th>
              <th colspan="2">Euro Odds</th>
              <th colspan="2">HK Odds</th>
              <th colspan="2">Malay Odds</th>
            </tr>
            <tr id="sweep-label-row">
              <th>Over</th>
              <th>Under</th>
              <th>Over</th>
              <th>Under</th>
              <th>Over</th>
              <th>Under</th>
              <th>Over</th>
              <th>Under</th>
            </tr>
          </thead>
          <tbody id="ou-sweep-body"></tbody>
        </table>
      </div>

      <p class="step-note active" id="market-step-note"></p>

      <div class="controls">
        <button id="check-market">Check</button>
        <button id="fill-market">Show Answers</button>
      </div>
    </div>
  </div>

  <div class="controls" id="page-footer-root"></div>
    </main>

    <aside class="formula-card" id="formula-card-root"></aside>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/formula-cards.js"></script>
  <script src="../js/exercise-common.js"></script>
  <script src="../js/opening-over-under-market.js"></script>
</body>
</html>
