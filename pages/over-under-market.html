<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3.5 Over / Under - Market</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="exercise-index" id="exercise-index-root"></aside>

    <main class="exercise-content">
  <h1>
    3.5 Over / Under
    <label for="ou-point-select" class="point-label">Point:</label>
    <select id="ou-point-select" class="point-select">
      <option value="2">2</option>
      <option value="2.25">2.25</option>
      <option value="2.5" selected>2.5</option>
      <option value="2.75">2.75</option>
    </select>
  </h1>

  <div class="stack">
    <div class="panel">
      <h2>Final Score Probability Matrix</h2>
      <table id="ou-matrix-table">
        <thead>
          <tr id="ou-matrix-header"><th>Home &#92; Away</th></tr>
        </thead>
        <tbody id="ou-matrix-body"></tbody>
      </table>

      <p class="step-note" id="step-note-1"></p>
      <p class="step-note" id="step-note-2"></p>
      <p class="step-note" id="step-note-3"></p>

      <div class="controls">
        <span class="part-section" id="ou-step-1">
          <button id="complete-under">Under</button>
        </span>
        <span class="part-section locked" id="ou-step-2">
          <button id="complete-middle">Push</button>
        </span>
        <span class="part-section locked" id="ou-step-3">
          <button id="complete-over">Over</button>
        </span>
        <button id="reset-ou">Reset</button>
        <button id="fill-ou">Show Answers</button>
      </div>
    </div>

    <div class="panel part-section locked" id="odds-section">
      <div class="lock-notice">Complete all steps above first to unlock.</div>
      <h2>Over / Under Fair Odds</h2>

      <table id="true-prob-table">
        <thead>
          <tr id="true-prob-header"><th></th></tr>
        </thead>
        <tbody>
          <tr id="true-prob-row"></tr>
        </tbody>
      </table>

      <table id="odds-table">
        <thead>
          <tr>
            <th>Selection</th>
            <th>Fair Probability</th>
            <th>Euro Odds</th>
            <th>HK Odds</th>
            <th>Malay Odds</th>
          </tr>
        </thead>
        <tbody id="odds-table-body"></tbody>
      </table>
      <div class="controls">
        <button id="check-odds-table">Check</button>
        <button id="fill-odds-table">Show Answers</button>
      </div>
    </div>
  </div>

  <div class="controls" id="page-footer-root"></div>
    </main>

    <aside class="formula-card" id="formula-card-root"></aside>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/formula-cards.js"></script>
  <script src="../js/exercise-common.js"></script>
  <script src="../js/over-under-market.js"></script>
</body>
</html>
