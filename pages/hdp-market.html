<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>3.6 HDP - Market</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="exercise-index" id="exercise-index-root"></aside>

    <main class="exercise-content">
  <h1>
    3.6 HDP
    <label for="hdp-line-select" class="point-label">Line:</label>
    <select id="hdp-line-select" class="point-select">
      <option value="-1">Home -1</option>
      <option value="-0.75">Home -0.75</option>
      <option value="-0.5">Home -0.5</option>
      <option value="-0.25">Home -0.25</option>
      <option value="0" selected>Home 0</option>
      <option value="0.25">Home +0.25</option>
      <option value="0.5">Home +0.5</option>
      <option value="0.75">Home +0.75</option>
      <option value="1">Home +1</option>
    </select>
  </h1>

  <div class="stack">
    <div class="panel">
      <h2>Final Score Probability Matrix</h2>
      <table id="hdp-matrix-table">
        <thead>
          <tr id="hdp-matrix-header"><th>Home &#92; Away</th></tr>
        </thead>
        <tbody id="hdp-matrix-body"></tbody>
      </table>

      <p class="step-note" id="step-note-1"></p>
      <p class="step-note" id="step-note-2"></p>
      <p class="step-note" id="step-note-3"></p>

      <div class="controls">
        <span class="part-section" id="hdp-step-1">
          <button id="complete-away">Away Covers</button>
        </span>
        <span class="part-section locked" id="hdp-step-2">
          <button id="complete-middle">Push</button>
        </span>
        <span class="part-section locked" id="hdp-step-3">
          <button id="complete-home">Home Covers</button>
        </span>
        <button id="reset-hdp">Reset</button>
        <button id="fill-hdp">Show Answers</button>
      </div>
    </div>

    <div class="panel part-section locked" id="odds-section">
      <div class="lock-notice">Complete all steps above first to unlock.</div>
      <h2>HDP Fair Odds</h2>

      <table id="true-prob-table">
        <thead>
          <tr id="true-prob-header"><th></th></tr>
        </thead>
        <tbody>
          <tr id="true-prob-row"></tr>
        </tbody>
      </table>

      <table id="odds-table">
        <thead>
          <tr>
            <th>Selection</th>
            <th>Fair Probability</th>
            <th>Euro Odds</th>
            <th>HK Odds</th>
            <th>Malay Odds</th>
          </tr>
        </thead>
        <tbody id="odds-table-body"></tbody>
      </table>
      <div class="controls">
        <button id="check-odds-table">Check</button>
        <button id="fill-odds-table">Show Answers</button>
      </div>
    </div>
  </div>

  <div class="controls" id="page-footer-root"></div>
    </main>

    <aside class="formula-card" id="formula-card-root"></aside>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/nav.js"></script>
  <script src="../js/formula-cards.js"></script>
  <script src="../js/exercise-common.js"></script>
  <script src="../js/hdp-market.js"></script>
</body>
</html>
